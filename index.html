<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Farai Car Finder • Find Your Dream Car</title>
<style>
:root{
  --bg:#0a0a12;
  --panel:rgba(255,255,255,.08);
  --panel-border:rgba(255,255,255,.15);
  --text:#e5e5e5;
  --text-dim:#b3b3c0;
  --accent:#14b8a6;
  --gold:#f59e0b;
  --radius:16px;
  --maxw:1200px;
  --h:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--bg);overflow-x:hidden;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--text);line-height:1.6}
img,svg{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.glass{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--panel-border)}

/* Lane marking background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(255,255,255,.03) 38px,rgba(255,255,255,.03) 44px);
  z-index:-1;
}

[data-reveal]{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}
[data-reveal].in-view{opacity:1;transform:translateY(0)}

header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--h);background:rgba(10,10,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--panel-border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;color:#fff}
.nav-btn{background:var(--gold);color:#000;border:none;padding:0 16px;border-radius:999px;font-weight:600;cursor:pointer;transition:.2s}
.nav-btn:hover{background:#d97706}

.hero{padding:calc(var(--h)+120px) 0 96px;text-align:center;background:linear-gradient(135deg,#0a0a18,#1a1a2e)}
.hero-inner{max-width:720px;margin:0 auto}
.hero-title{font-size:clamp(2.4rem,6vw,3.8rem);font-weight:800;letter-spacing:-.03em;color:#fff;margin-bottom:16px}
.hero-subtitle{font-size:clamp(1rem,1.5vw,1.15rem);color:#c9c9d2;margin-bottom:32px}

/* Dashboard search bar */
.search-container{background:var(--panel);border-radius:var(--radius);padding:16px;display:flex;gap:8px;backdrop-filter:blur(12px)}
.search-container input,search-container select,.search-container button{
  flex:1;color:#fff;border:none;background:transparent;outline:none;font-size:15px
}
.search-container input::placeholder{color:#8a8a96}
.search-container button{background:var(--accent);color:#fff;border-radius:8px;padding:0 20px;cursor:pointer;font-weight:600;transition:.2s}
.search-container button:hover{background:#0d9488}

/* Mode tabs */
.mode-tabs{display:flex;gap:8px;max-width:400px;margin:0 auto 40px;justify-content:center}
.mode-btn{
  padding:12px 24px;border-radius:999px;border:none;font-weight:600;cursor:pointer;transition:.2s
}
.mode-active{background:var(--accent);color:#000}
.mode-pastel{background:var(--panel);color:var(--text)}
.mode-pastel:hover{background:rgba(255,255,255,.12)}

/* Listings grid */
.listings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.car-card{background:var(--panel);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--panel-border)}
.car-img{background:linear-gradient(45deg,#1f2937,#2d3748);aspect-ratio:16/9;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:48px;color:#5a6a7d}
.car-info h3{color:#fff;font-size:16px;font-weight:600;margin-bottom:6px}
.car-info p{color:#a3a3b3;font-size:14px;margin-bottom:12px}
.car-meta{display:flex;gap:12px;align-items:center;font-size:13px;color:#c9c9d2}
.price{font-weight:700;color:#fff}

/* Modal */
#auth-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:200}
#auth-modal.open{display:flex}
#modal-box{background:#fff;border-radius:var(--radius);width:90%;max-width:400px;padding:32px;position:relative;color:#333}
#modal-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
#modal-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
#modal-box .close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;color:#666;cursor:pointer}
.modal-tabs{display:flex;gap:12px;margin-bottom:20px}
.modal-tab{padding:8px 16px;border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
.modal-tab.active{border-color:var(--accent)}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head><<body>
<header class="site-header">
<div class="nav-inner wrap">
<a href="#top" class="logo">🚗 Farai <span class="accent">Car Finder</span></a>
<nav class="mode-tabs">
<button class="mode-btn mode-active" id="buy-tab">Buy</button>
<button class="mode-btn" id="rent-tab">Rent</button>
<button class="mode-btn" id="sell-tab">Sell</button>
</nav>
<button class="nav-btn" id="open-signup">Sign In</button>
</div>
</header>

<main id="top">
<section class="hero">
<div class="hero-inner" data-reveal>
<h1 class="hero-title">Let's find your dream car</h1>
<p class="hero-subtitle">Search by keyword, location, or budget to discover verified listings across Zimbabwe</p>
<form class="search-container" role="search" onsubmit="return false;">
<input type="text" id="search-input" placeholder="Car model, make, or location..." />
<select id="search-category"><option>All Categories</option><option>SUV</option><option>Sedan</option><option>Bakkie</option></select>
<button type="submit">Search</button>
</form>
</div>
</section>

<div id="listings" class="listings" data-reveal></div>
</main>

<!-- Modal -->
<div id="auth-modal">
<div id="modal-box">
<button class="close" id="modal-close">✕</button>
<div class="modal-tabs">
<button class="modal-tab active" id="login-tab">Login</button>
<button class="modal-tab" id="signup-tab">Sign Up</button>
</div>
<div id="login-form">
<input type="email" id="login-email" placeholder="Email" />
<input type="password" id="login-pass" placeholder="Password" />
<button type="button" id="btn-login">Sign In</button>
</div>
<div id="signup-form" style="display:none">
<input type="text" id="signup-name" placeholder="Full Name" />
<input type="email" id="signup-email" placeholder="Email" />
<input type="password" id="signup-pass" placeholder="Password" />
<button type="button" id="btn-signup">Create Account</button>
</div>
</div>
</div>

<div id="toast"></div>

<script>
const cars = [
  {id:1,make:'Toyota',model:'Land Cruiser',type:'SUV',price:'ZWR 25,000,000',location:'Harare',mode:'sale',emoji:'🚙'},
  {id:2,make:'Honda',model:'CR-V',type:'SUV',price:'ZWR 18,500,000',location:'Mutare',mode:'sale',emoji:'🚙'},
  {id:3,make:'Nissan',model:'X-Trail',type:'SUV',price:'ZWR 12,000,000',location:'Kwekwe',mode:'rent',priceRent:'ZWR 850/day',emoji:'🚙'},
  {id:4,make:'Volkswagen',model:'Golf',type:'Sedan',price:'ZWR 8,500,000',location:'Harare',mode:'sale',emoji:'🚗'},
  {id:5,make:'Mazda',model:'Demio',type:'Sedan',price:'ZWR 6,200,000',location:'Masvingo',mode:'rent',priceRent:'ZWR 550/day',emoji:'🚗'},
  {id:6,make:'Toyota',model:'Hilux',type:'Bakkie',price:'ZWR 15,000,000',location:'Beitbridge',mode:'sale',emoji:'🚚'},
  {id:7,make:'Isuzu',model:'NPR',type:'Bakkie',price:'ZWR 12,500,000',location:'Bulawayo',mode:'sale',emoji:'🚚'},
  {id:8,make:'Mitsubishi',model:'Pajero',type:'SUV',price:'ZWR 22,000,000',location:'Harare',mode:'rent',priceRent:'ZWR 950/day',emoji:'🚙'},
  {id:9,make:'Hyundai',model:'Accent',type:'Sedan',price:'ZWR 5,800,000',location:'Gweru',mode:'sale',emoji:'🚗'},
  {id:10,make:'Ford',model:'Ranger',type:'Bakkie',price:'ZWR 18,000,000',location:'Harare',mode:'rent',priceRent:'ZWR 750/day',emoji:'🚚'},
  {id:11,make:'BMW',model:'X3',type:'SUV',price:'ZWR 35,000,000',location:'Harare',mode:'sale',emoji:'🚙'},
  {id:12,make:'Mercedes',model:'C-Class',type:'Sedan',price:'ZWR 28,000,000',location:'Harare',mode:'rent',priceRent:'ZWR 1200/day',emoji:'🚗'}
];

let filterMode='sale';

function render(cars){
  const container=document.getElementById('listings');
  if(!cars.length){container.innerHTML='<p style="color:#b3b3c0;text-align:center">No cars found</p>';return}
  container.innerHTML=cars.map(c=>`
    <div class="car-card">
      <div class="car-img">${c.emoji}</div>
      <div class="car-info">
        <h3>${c.make} ${c.model}</h3>
        <p>${c.type} • ${c.location}</p>
      </div>
      <div class="car-meta">
        ${c.mode==='sale'?`<span class="price">ZWR ${c.price.toLocaleString()}</span>`:`<span class="price">${c.priceRent}</span><span style="color:#a3a3b3">/day</span>`}
        <span style="color:#14b8a6">${c.mode==='sale'?'For Sale':'For Rent'}</span>
      </div>
    </div>
  `).join('')
}

function filter(mode){
  filterMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('mode-active'));
  document.querySelector(`.mode-${mode}-tab`).classList.add('mode-active');
  render(cars.filter(c=>c.mode===mode));
}

document.getElementById('buy-tab').addEventListener('click',()=>filter('sale'));
document.getElementById('rent-tab').addEventListener('click',()=>filter('rent'));
document.getElementById('sell-tab').addEventListener('click',()=>{
  document.getElementById('listings').innerHTML='<p style="color:#b3b3c0;text-align:center">List your vehicle in 60 seconds</p>';
});

render(cars.filter(c=>c.mode==='sale'));

// Modal
const modal=document.getElementById('auth-modal'),btn=document.getElementById('open-signup'),close=document.getElementById('modal-close')
btn.addEventListener('click',()=>{modal.classList.add('open')})
close.addEventListener('click',()=>{modal.classList.remove('open')});

document.getElementById('login-tab').addEventListener('click',()=>{
  document.getElementById('login-tab').classList.add('active');
  document.getElementById('signup-tab').classList.remove('active');
  document.getElementById('signup-form').style.display='none';
  document.getElementById('login-form').style.display='block';
});
document.getElementById('signup-tab').addEventListener('click',()=>{
  document.getElementById('signup-tab').classList.add('active');
  document.getElementById('login-tab').classList.remove('active');
  document.getElementById('login-form').style.display='none';
  document.getElementById('signup-form').style.display='block';
});

document.getElementById('btn-login').addEventListener('click',()=>{show('Signing in...');setTimeout(()=>show('Account created!'),1000)});
document.getElementById('btn-signup').addEventListener('click',()=>{show('Account created!');modal.innerHTML='<div style="text-align:center;padding:40px;color:#fff"><h2 style="margin:16px 0">Welcome!</h2><p>You can now list your vehicle</p></div>'});

function show(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.querySelectorAll('[data-reveal]').forEach(el=>{
  const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){el.classList.add('in-view');io.unobserve(e)}}),{threshold:.12});io.observe(el)
});
</script>
</body>
</html>
