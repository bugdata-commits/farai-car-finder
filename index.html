<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Farai Car Finder • Zimbabwe</title>
<style>
:root{
  --bg:#0f0f14;
  --panel:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.08);
  --text:#e5e5e5;
  --text-dim:#b3b3c0;
  --accent:#14b8a6;
  --gold:#f59e0b;
  --radius:12px;
  --maxw:420px;
  --h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--bg);overflow-x:hidden;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--text)}
img,svg{display:block;max-width:100%}a{color:inherit;text-decoration:none}

/* Lane marking background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(90deg,transparent,transparent 32px,rgba(255,255,255,.02) 32px,rgba(255,255,255,.02) 40px);
  z-index:-1;
}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.glass{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius)}

[data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .6s ease-out,transform .6s ease-out}
[data-reveal].in-view{opacity:1;transform:translateY(0)}

/* Header */
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--h);background:rgba(10,10,15,.9)**:backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:100%}
.logo{font-weight:700;font-size:14px;color:#fff;line-height:1}

/* Mode tabs - sliding indicator */
.mode-tabs{
  display:flex;gap:4px;border-bottom:1px solid var(--border);padding-bottom:8px
}
.tab{
  padding:8px 16px;background:transparent;border:none;cursor:pointer;color:var(--text-dim);font-size:13px;border-radius:999px;transition:.2s
}
.tab.active{background:var(--accent);color:#000}

/* Search button */
.search-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--accent);color:#000;border:none;border-radius:999px;font-weight:600;cursor:pointer;transition:.2s
}
.search-btn:hover{transform:scale(.98)}

/* Hero */
.hero{
  padding-top:calc(var(--h)+48px);
  padding-bottom:32px;
  text-align:center;
  background:linear-gradient(135deg,#0f0f1e,#1a1a2e);
}
.hero-title{
  font-size:2rem;
  font-weight:700;
  line-height:1.1;
  margin-bottom:12px;
  color:#fff
}
.hero-subtitle{
  font-size:15px;
  color:#a3a3b3;
  margin-bottom:24px
}
.search-bar{
  display:flex;
  gap:8px;
  margin-bottom:24px;
}
.search-bar input{
  flex:1;
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:0 16px;
  font-size:15px;
  outline:none;
}
.search-bar input::placeholder{color:#8a8a96}
.search-bar button{
  background:var(--accent);
  color:#000;
  border:none;
  border-radius:999px;
  padding:0 20px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.search-bar button:hover{transform:scale(.97)}

/* Listings */
.listings{display:grid;gap:12px}
.card{
  background:var(--panel);
  border-radius:var(--radius);
  border:1px solid var(--border);
  overflow:hidden;
}
.card-media{
  background:linear-gradient(135deg,#1f2937,#2d3748);
  aspect-ratio:16/9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:#5a6a7d
}
.card-body{
  padding:14px
}
.card-title{
  font-size:15px;
  font-weight:600;
  color:#fff;
  margin-bottom:6px
}
.card-location{
  font-size:13px;
  color:#a3a3b3;
  margin-bottom:10px
}
.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:14px
}
.card-price{
  font-weight:600;
  color:#fff
}
.card-status{
  background:var(--gold);
  color:#000;
  font-size:12px;
  padding:4px 10px;
  border-radius:999px;
  font-weight:600
}

/* Modal */
#auth-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:200}
#auth-modal.open{display:flex}
#modal-box{background:#fff;border-radius:var(--radius);width:90%;max-width:400px;padding:24px;position:relative;color:#333}
#modal-box input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px;font-size:15px}
#modal-box button{width:100%;padding:10px;background:var(--accent);color:#000;border:none;border-radius:6px;font-weight:600;cursor:pointer;margin-top:8px}
#modal-box .close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;color:#666;cursor:pointer}
.tab.active{background:var(--accent);color:#000}

/* Toast */
#toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:10px 20px;
  border-radius:8px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s
}
#toast.show{opacity:1}

/* Footer */
footer{margin-top:40px;padding:32px 0;border-top:1px solid var(--border)}
.footer-grid{display:grid;gap:20px;font-size:13px}
.footer-col h4{font-size:13px;font-weight:700;color:#fff;margin-bottom:10px}
.footer-col a{color:var(--text-dim);transition:color .2s}
.footer-col a:hover{color:var(--accent)}
</style>
</head>
<body>
<header class="site-header">
<div class="nav-inner wrap">
<a href="#" class="logo">🚗 Farai <span class="accent">Car Finder</span></a>
<div class="mode-tabs">
<button class="tab active" data-mode="sale">Buy</button>
<button class="tab" data-mode="rent">Rent</button>
<button class="tab" data-mode="sell">Sell</button>
</div>
<button class="search-btn" id="open-signup">Sign In</button>
</div>
</header>

<main class="hero">
<div class="hero-inner" data-reveal>
<h1 class="hero-title">Let's find your dream car</h1>
<p class="hero-subtitle">Search by brand, location, or budget • Verified sellers across Zimbabwe</p>
<form class="search-bar" role="search" onsubmit="return false;">
<input type="text" id="search" placeholder="Search cars, locations..." />
<button type="submit">Search</button>
</form>
</div>
</main>

<div id="listings" class="listings" data-reveal></div>

<!-- Modal -->
<div id="auth-modal">
<div id="modal-box">
<button class="close" id="modal-close">✕</button>
<div style="display:flex;gap:8px;margin-bottom:16px">
<button class="tab active" id="login-tab">Login</button>
<button class="tab" id="signup-tab">Sign Up</button>
</div>
<div id="login-content">
<input type="email" id="login-email" placeholder="Email" />
<input type="password" id="login-pass" placeholder="Password" />
<button class="search-btn" style="width:100%;margin-top:8px">Sign In</button>
</div>
<div id="signup-content" style="display:none">
<input type="text" id="signup-name" placeholder="Full Name" />
<input type="email" id="signup-email" placeholder="Email" />
<input type="password" id="signup-pass" placeholder="Password" />
<button class="search-btn" style="width:100%;margin-top:8px">Create Account</button>
</div>
</div>
</div>

<div id="toast"></div>

<script>
const cars = [
  {make:'Toyota',model:'Land Cruiser',type:'SUV',price:'25,000,000',location:'Harare',mode:'sale',emoji:'🚙'},
  {make:'Honda',model:'CR-V',type:'SUV',price:'18,500,000',location:'Mutare',mode:'sale',emoji:'🚙'},
  {make:'Nissan',model:'X-Trail',type:'SUV',price:'12,000,000',location:'Kwekwe',mode:'rent',rent:'850/day',emoji:'🚙'},
  {make:'VW',model:'Golf',type:'Sedan',price:'8,500,000',location:'Harare',mode:'sale',emoji:'🚗'},
  {make:'Mazda',model:'Demio',type:'Sedan',price:'6,200,000',location:'Masvingo',mode:'rent',rent:'550/day',emoji:'🚗'},
  {make:'Toyota',model:'Hilux',type:'Bakkie',price:'15,000,000',location:'Beitbridge',mode:'sale',emoji:'🚚'}
];

let currentMode='sale';

function render(cars){
  const container=document.getElementById('listings');
  if(!cars.length){container.innerHTML='<p style="color:#a3a3b3;text-align:center;padding:40px 0">No cars found</p>';return}
  container.innerHTML=cars.map(c=>`<div class="card"><div class="card-media">${c.emoji}</div><div class="card-body"><div class="card-title">${c.make} ${c.model}</div><div class="card-location">${c.type} • ${c.location}</div><div class="card-footer"><span class="card-price">ZWR ${c.mode==='sale'?c.price:cars.rent}</span><span class="card-status">${c.mode==='sale'?'For Sale':'For Rent'}</span></div></div></div>`).join('')
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',e=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  currentMode=t.dataset.mode;
  render(cars.filter(c=>c.mode===currentMode));
}));

render(cars.filter(c=>c.mode==='sale'));

// Modal
const modal=document.getElementById('auth-modal'),openBtn=document.getElementById('open-signup'),closeBtn=document.getElementById('modal-close');
openBtn.addEventListener('click',()=>{modal.classList.add('open')});
closeBtn.addEventListener('click',()=>{modal.classList.remove('open')});

document.getElementById('signup-tab').addEventListener('click',()=>{
  document.getElementById('signup-tab').classList.add('active');
  document.getElementById('login-tab').classList.remove('active');
  document.getElementById('login-content').style.display='none';
  document.getElementById('signup-content').style.display='block';
});
document.getElementById('login-tab').addEventListener('click',()=>{
  document.getElementById('login-tab').classList.add('active');
  document.getElementById('signup-tab').classList.remove('active');
  document.getElementById('signup-content').style.display='none';
  document.getElementById('login-content').style.display='block';
});

function show(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.querySelectorAll('[data-reveal]').forEach(el=>{
  const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){el.classList.add('in-view');io.unobserve(e)}}),{threshold:.15});io.observe(el)
});
</script>
</body>
</html>
